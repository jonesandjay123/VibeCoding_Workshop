<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Slide 4</title>
  <style>
    :root {
      --color-primary: #2C3E50;
      --color-secondary: #3498DB;
      --color-muted: #ECF0F1;
    }
  </style>
</head>
<body class="col bg-surface" style="width: 960px; height: 540px;">
  <div style="background: #2C3E50; padding: 20px 40px;">
    <h1 style="color: #FFFFFF; font-size: 32px; margin: 0;">Slide 3：AI 不是答題機</h1>
  </div>
  <div class="col" style="padding: 30px 40px; gap: 20px;">
    <div class="rounded" style="background: #3498DB; padding: 16px 24px;">
      <p style="color: #FFFFFF; font-size: 20px; margin: 0; font-weight: bold;">核心概念：AI 是超快的實習生，不是百科全書</p>
    </div>
    <div style="background: #ECF0F1; padding: 20px; border-radius: 8px;">
      <p style="font-size: 16px; color: #2C3E50; margin: 0 0 12px 0; font-weight: bold;">講師提示：</p>
      <ul style="margin: 0; padding-left: 24px; color: #34495E;">
        <li style="margin-bottom: 8px;"><p style="margin: 0;"><b>講：</b>三種任務——查事實（驗證對錯）、產草稿（喜不喜歡）、做你不會的事（能不能跑）</p></li>
        <li style="margin-bottom: 8px;"><p style="margin: 0;"><b>講：</b>「你覺得它錯，代表你有品味」</p></li>
        <li><p style="margin: 0;"><b>做：</b>舉例「請實習生做海報，做得醜不叫錯，叫再改」</p></li>
      </ul>
    </div>
  </div>
</body>
</html>
