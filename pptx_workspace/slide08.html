<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Slide 8</title>
  <style>
    :root {
      --color-primary: #2C3E50;
      --color-secondary: #27AE60;
      --color-muted: #ECF0F1;
    }
  </style>
</head>
<body class="col bg-surface" style="width: 960px; height: 540px;">
  <div style="background: #27AE60; padding: 20px 40px;">
    <h1 style="color: #FFFFFF; font-size: 32px; margin: 0;">Slide 7：表格結構</h1>
  </div>
  <div class="col" style="padding: 30px 40px; gap: 20px;">
    <div class="rounded" style="background: #2ECC71; padding: 16px 24px;">
      <p style="color: #FFFFFF; font-size: 20px; margin: 0; font-weight: bold;">核心概念：表格是「結構最直觀」的 HTML 元素</p>
    </div>
    <div style="background: #ECF0F1; padding: 20px; border-radius: 8px;">
      <p style="font-size: 16px; color: #2C3E50; margin: 0 0 12px 0; font-weight: bold;">講師提示：</p>
      <ul style="margin: 0; padding-left: 24px; color: #34495E;">
        <li style="margin-bottom: 8px;"><p style="margin: 0;"><b>講：</b>&lt;table&gt; 整張表、&lt;tr&gt; 一橫排、&lt;td&gt; 一格</p></li>
        <li style="margin-bottom: 8px;"><p style="margin: 0;"><b>講：</b>「就像 Excel，一格一格，只是用文字寫出來」</p></li>
        <li><p style="margin: 0;"><b>做：</b>一起數一個表格有幾個 &lt;tr&gt;、幾個 &lt;td&gt;</p></li>
      </ul>
    </div>
  </div>
</body>
</html>
